          echo '9aeb434d623a0e2fff544dcc62b256ebbbb000e9e7ef714ae8cb1aaf84a599b3  docs/test/packages/friends-voplus-1.0.0-77-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 82 signed package
        run: |
