            --output docs/test/packages/friends-voplus-1.0.0-82-five-friends.ipa
          echo '09cb82d38f68d611168e3789bbd684ef2920eceb9367c81d5a3f65b38baa1308  docs/test/packages/friends-voplus-1.0.0-82-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 83 signed package
        run: |
