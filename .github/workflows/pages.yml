name: Publish developer site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source update checks
        run: python3 scripts/test_reader_sources.py
      - name: Check original source releases
        run: python3 scripts/check_reader_sources.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Xiaoming Reader support page
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://dev.mk-musician.com/xiaoming-reader/ \
            | grep --fixed-strings '小铭读书｜支持与隐私政策'
