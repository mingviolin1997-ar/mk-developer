name: Publish developer site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test source update checks
        run: python3 scripts/test_reader_sources.py
      - name: Test signed-package download routing
        run: python3 scripts/test_download_routes.py
      - name: Check original source releases
        run: python3 scripts/check_reader_sources.py
      - name: Fetch verified VoPlus 47 signed package
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/mingviolin1997-ar/mk-developer/releases/download/voplus-1.0.0-47/friends-voplus-1.0.0-47-five-friends.ipa \
            --output docs/test/packages/friends-voplus-1.0.0-47-five-friends.ipa
          echo '12f880c7c778db554cebec097f14e794bbd76151e5d9adb46e848447df560c50  docs/test/packages/friends-voplus-1.0.0-47-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 50 signed package
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/mingviolin1997-ar/mk-developer/releases/download/voplus-1.0.0-50/friends-voplus-1.0.0-50-five-friends.ipa \
            --output docs/test/packages/friends-voplus-1.0.0-50-five-friends.ipa
          echo '7b6ab5f1be5dcb538162169bf9e3fc2b9876029e29170f1d61558d42fad4fa10  docs/test/packages/friends-voplus-1.0.0-50-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 59 signed package
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/mingviolin1997-ar/mk-developer/releases/download/voplus-1.0.0-59/friends-voplus-1.0.0-59-five-friends.ipa \
            --output docs/test/packages/friends-voplus-1.0.0-59-five-friends.ipa
          echo '04ffb37a1ef295dcf64da5ca2412b570b9c368370b7eb3af096ccbc11715d07b  docs/test/packages/friends-voplus-1.0.0-59-five-friends.ipa' | sha256sum --check --strict
      - name: Reuse verified immutable download routes
        uses: actions/cache@v4
        with:
          path: ~/.cache/mk-download-routes
          key: download-routes-v1-${{ hashFiles('docs/test/packages/*.ipa') }}
          restore-keys: download-routes-v1-
      - name: Prepare verified accelerated downloads and original fallback
        run: python3 scripts/prepare_download_routes.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Xiaoming Reader support page
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://dev.mk-musician.com/xiaoming-reader/ \
            | grep --fixed-strings '小铭读书｜支持与隐私政策'
