          echo 'dbea0c300598db9040c35605b8dbcb6897c20e458a8d24a2310abfc2b82de530  docs/test/packages/friends-voplus-1.0.0-85-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 86 signed package
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/mingviolin1997-ar/mk-developer/releases/download/voplus-1.0.0-86/friends-voplus-1.0.0-86-five-friends.ipa \
            --output docs/test/packages/friends-voplus-1.0.0-86-five-friends.ipa
          echo '924464326c5804463053bac995158a1e08404682467e72a9c4f653c8a1b49799  docs/test/packages/friends-voplus-1.0.0-86-five-friends.ipa' | sha256sum --check --strict
      - name: Reuse verified immutable download routes
        uses: actions/cache@v4
        with:
          path: ~/.cache/mk-download-routes
          key: download-routes-v1-${{ hashFiles('docs/test/packages/*.ipa') }}
          restore-keys: download-routes-v1-
      - name: Build bounded Pages artifact with original and verified backup downloads
        run: python3 scripts/build_pages_stage.py --source docs --output work/pages-site
      - name: Enforce Pages artifact byte limit
        run: python3 scripts/build_pages_stage.py --check-size work/pages-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/pages-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify Xiaoming Reader support page
        run: |
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            https://dev.mk-musician.com/xiaoming-reader/ \
            | grep --fixed-strings '小铭读书｜支持与隐私政策'
