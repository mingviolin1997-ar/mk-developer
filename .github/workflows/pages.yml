          echo 'd7c5cf79611a1fee7a6e47713636e1fe856956126552c4239957d96507797bd2  docs/test/packages/friends-voplus-1.0.0-84-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 85 signed package
        run: |
