            --output docs/test/packages/friends-voplus-1.0.0-61-five-friends.ipa
          echo 'ea1225f7c14cc7a8e77af5a49e6123b06358f2874600579e2e99c49276693c48  docs/test/packages/friends-voplus-1.0.0-61-five-friends.ipa' | sha256sum --check --strict
      - name: Fetch verified VoPlus 64 signed package
